
services:
  db:
    image: postgres:18.4
    container_name: flask_crisdb
    restart: always
    environment:
      POSTGRES_USER: psqluser
      POSTGRES_PASSWORD: qpssenha
      POSTGRES_DB: psqldb
    ports:
      - "5432"
    volumes:
      - psql_data:/var/lib/postgresql/data

  backe_end:
    build: .
    restart: always
    container_name: flask_cris
    ports:
      - "5018:5000"
    env_file:
    - path: .env
      required: false

volumes:
  psql_data:





